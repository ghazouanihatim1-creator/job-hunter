name: Job Hunter Automation

on:
  schedule:
    # S'exécute automatiquement toutes les 3 heures
    - cron: '17 */3 * * *'
  workflow_dispatch: # Permet de déclencher le script manuellement !

jobs:
  run-hunter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Job Hunter
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    - name: Commit and Push updated memory
      run: |
        git config --global user.name 'JobHunterBot'
        git config --global user.email 'bot@jobhunter.local'
        git add seen_jobs.json || true
        git commit -m "Auto-update seen jobs database" || true
        git push || true
